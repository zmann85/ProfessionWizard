<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="65%">
    <stop offset="0" stop-color="#3a2a1c"/><stop offset="0.6" stop-color="#1c1510"/><stop offset="1" stop-color="#0e0b08"/>
  </radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#f2b860" stop-opacity="0.30"/><stop offset="1" stop-color="#f2b860" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d27a"/><stop offset="1" stop-color="#9c7326"/></linearGradient>
  <radialGradient id="paper" cx="45%" cy="40%" r="75%">
    <stop offset="0" stop-color="#f4e3b8"/><stop offset="0.7" stop-color="#e2c68c"/><stop offset="1" stop-color="#b8935a"/>
  </radialGradient>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="7" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="9" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0 0.08  0 0 0 -0.9 0.5"/>
  </filter>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7dbe0"/><stop offset="0.5" stop-color="#8d949c"/><stop offset="1" stop-color="#4c5259"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a3518"/><stop offset="0.5" stop-color="#8a5a2c"/><stop offset="1" stop-color="#4a2a12"/></linearGradient>
  <radialGradient id="coin" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff0a8"/><stop offset="0.55" stop-color="#e8b740"/><stop offset="1" stop-color="#9a6a14"/></radialGradient>
</defs>
<rect x="0" y="0" width="400" height="400" rx="56" fill="url(#bg)"/>
<rect x="14" y="14" width="372" height="372" rx="44" fill="none" stroke="url(#gold)" stroke-width="6"/>
<circle cx="200" cy="205" r="160" fill="url(#glow)"/>

<g transform="translate(186,200) rotate(-5)">
  <rect x="-128" y="-128" width="236" height="262" rx="6" fill="#000" fill-opacity="0.45" transform="translate(7,9)" filter="url(#rough)"/>
  <g filter="url(#rough)">
    <rect x="-128" y="-128" width="236" height="262" rx="6" fill="url(#paper)"/>
    <rect x="-128" y="-128" width="236" height="262" rx="6" filter="url(#grain)"/>
  </g>
  <path d="M -104 -108 C -70 -114 -30 -102 10 -110 C 36 -114 62 -108 84 -112" fill="none" stroke="#4a3418" stroke-width="5" stroke-linecap="round"/>
  <rect x="-108" y="-92" width="36" height="36" rx="4" fill="#d9c08a" stroke="#4a3418" stroke-width="3.5"/><path d="M -100 -73 L -92 -65 L -78 -83" fill="none" stroke="#7a2a12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M -58 -74 C -13.0 -78 32.0 -70 92 -76" fill="none" stroke="#4a3418" stroke-opacity="0.9" stroke-width="5" stroke-linecap="round"/><rect x="-108" y="-40" width="36" height="36" rx="4" fill="#d9c08a" stroke="#4a3418" stroke-width="3.5"/><path d="M -100 -21 L -92 -13 L -78 -31" fill="none" stroke="#7a2a12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M -58 -22 C -22.0 -26 14.0 -18 62 -24" fill="none" stroke="#4a3418" stroke-opacity="0.9" stroke-width="5" stroke-linecap="round"/><rect x="-108" y="12" width="36" height="36" rx="4" fill="#d9c08a" stroke="#4a3418" stroke-width="3.5"/><path d="M -58 30 C -16.0 26 26.0 34 82 28" fill="none" stroke="#4a3418" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/><rect x="-108" y="64" width="36" height="36" rx="4" fill="#d9c08a" stroke="#4a3418" stroke-width="3.5"/><path d="M -58 82 C -28.0 78 2.0 86 42 80" fill="none" stroke="#4a3418" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
</g>

<!-- smith's hammer leaning across the list -->
<g transform="translate(268,232) rotate(38)">
  <rect x="-12" y="-14" width="24" height="168" rx="9" fill="#000" fill-opacity="0.35" transform="translate(9,7)"/>
  <rect x="-11" y="-14" width="22" height="168" rx="9" fill="url(#wood)" stroke="#2a180a" stroke-width="3"/>
  <path d="M -5 20 L -5 140" stroke="#2a180a" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="-60" y="-62" width="120" height="54" rx="8" fill="#000" fill-opacity="0.35" transform="translate(9,7)"/>
  <path d="M -62 -58 L 50 -62 Q 62 -62 62 -50 L 62 -20 Q 62 -8 50 -8 L -62 -12 Z" fill="url(#steel)" stroke="#2b2f34" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M -62 -58 L -76 -54 L -76 -16 L -62 -12 Z" fill="#6f767e" stroke="#2b2f34" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M -56 -50 L 48 -54" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- a gold coin: the cheapest way -->
<g transform="translate(108,318)">
  <ellipse cx="6" cy="8" rx="44" ry="44" fill="#000" fill-opacity="0.4"/>
  <circle r="44" fill="url(#coin)" stroke="#6e4a0c" stroke-width="4"/>
  <circle r="33" fill="none" stroke="#9a6a14" stroke-width="3" stroke-opacity="0.8"/>
  <circle r="22" fill="#f6cf5a" stroke="#9a6a14" stroke-width="2.5" stroke-opacity="0.7"/>
  <path d="M -26 -18 A 32 32 0 0 1 4 -31" fill="none" stroke="#fff6c8" stroke-width="5" stroke-linecap="round" stroke-opacity="0.85"/>
</g>
</svg>